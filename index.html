<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mantar Kataloğu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap&text=Mantar%20Katalo%C4%9FuMushroom%20Catalog">
<link rel="stylesheet" href="style.css?v=20261021e">
<script>
  // Tema ve dil titremesini önlemek için erken uygula
  try {
    const t = localStorage.getItem("mk-theme"); if (t) document.documentElement.dataset.theme = t;
    const l = localStorage.getItem("mk-lang") || ((navigator.language || "tr").toLowerCase().startsWith("tr") ? "tr" : "en");
    document.documentElement.lang = l;
  } catch (e) {}
</script>
</head>
<body>
<div class="bg" aria-hidden="true">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i><i class="blob b5"></i>
</div>

<header class="toolbar glass">
  <div class="toolbar-row">
    <h1>🍄 <span data-i18n="title"></span></h1>
    <div class="search glass-inset">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4-4"/></svg>
      <input type="search" id="search" data-i18n-ph="search" data-i18n-aria="search_aria" autocomplete="off">
    </div>
    <button class="btn lang" id="lang" aria-label="Language / Dil" title="Language / Dil"></button>
    <button class="btn icon" id="theme" data-i18n-aria="theme" data-i18n-title="theme"></button>
  </div>
  <div class="tabs fade-x" id="tabs" role="tablist"></div>
  <div class="letters fade-x" id="letters" role="group" data-i18n-aria="az_aria"></div>
</header>

<main>
  <section class="intro glass"><p data-i18n-html="intro"></p></section>
  <details class="info-card glass">
    <summary data-i18n="info_title"></summary>
    <div class="info-body" data-i18n-html="info_body"></div>
  </details>
  <p class="count" id="count" aria-live="polite"></p>
  <section class="grid" id="grid"></section>
  <div class="more"><button class="btn" id="more" hidden></button></div>
</main>

<dialog id="modal" class="glass">
  <div class="modal-bar"><span class="modal-bar-title" id="modal-title"></span><button class="btn icon close" id="close" data-i18n-aria="close">✕</button></div>
  <div id="modal-body"></div>
</dialog>

<button class="btn icon fab" id="top" data-i18n-aria="top" aria-label="Yukarı">↑</button>

<footer data-i18n="footer"></footer>

<script src="data.js?v=20261021e"></script>
<script src="i18n.js?v=20261021e"></script>
<script src="app.js?v=20261021e"></script>
</body>
</html>
